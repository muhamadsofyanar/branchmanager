services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Isi APP_URL di .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Isi ADMIN_EMAIL di .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Isi ADMIN_PASSWORD di .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_PATH: /data/mulia.sqlite
      PORT: 3000
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - mulia_data:/data
volumes:
  mulia_data:
